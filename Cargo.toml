[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
stemma-core = { path = "crates/stemma-core" }
tokio = { version = "1", features = ["process", "rt-multi-thread", "macros", "sync", "fs"] }
thiserror = "2"
tempfile = "3"
